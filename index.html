<!DOCTYPE html>
<html>

  <head>
    <title>Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="calculator.js" defer> </script>
  </head>

  <body>
    <h1 style="text-align: center">Calculator</h1>
    <div class="container">
      <div class="calculator"> 
        <div class="display_result">
          <div class="expression_entered"></div>
          <div class="result"></div>
        </div>
        <div class="buttons">
          <div class="first_column">
            <div class="first_row">
              <button id="btn_clear">CLEAR</button> <!-- should be bigger than AC -->
              <button id="bth_ce">CE</button>
            </div>
            <div class="second_row">
              <button id="btn_7">7</button>
              <button id="btn_8">8</button>
              <button id="btn_9">9</button>
            </div>

            <div class="third_row">
              <button id="btn_4">4</button>
              <button id="btn_5">5</button>
              <button id="btn_6">6</button>
            </div>

            
            <div class="fourth_row">
              <button id="btn_1">1</button>
              <button id="btn_2">2</button>
              <button id="btn_3">3</button>
            </div>
            
            <div class="fifth_row">
              <button id="btn_0">0</button> <!-- should be bigger than . -->
              <button id="btn_.">.</button>
            </div>

          </div>
          <div class="second_column">
            <button id="btn_plus">+</button>
            <button id="btn_minus">-</button>
            <button id="btn_mul">x</button>
            <button id="btn_div">/</button>
            <button id="btn_equals">=</button>
          </div>

        </div>
      </div>
    </div>
  </body>

</html>
